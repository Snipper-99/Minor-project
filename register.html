<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        body {
            margin: 0;
            background-color: #f6f6f6;
            background-image: url(Images/register-background.jpeg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #C5DCF2;
            height: calc(91.5vh);


        }

        h1 {
            color: #0b5531;
            font-style: oblique;
            font-size: 500%;
            display: flex;
            justify-content: center;
            margin: 0;

        }


        form {

            display: flex;
            flex-direction: column;
            justify-content: center;

            padding: 20px 20px;
            border-radius: 57px;

            width: 500px;

        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 28px;


        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 11px;
            box-sizing: border-box;


        }

        .account {
            background-color: #64f58f;
            color: rgb(68, 5, 5);
            padding: 10px 10px;
            border-radius: 5px;
            width: 30%;
            text-decoration: none;
            font-weight: 800;
            font-size: 100%;
            margin-top: 15px;
            margin-left: 35%;
            font-family: Georgia, 'Times New Roman', Times, serif;



        }

        .question {
            font-size: 145%;

        }

        .login {
            text-decoration: none;
            color: rgb(23, 27, 25);
            padding: 10px 10px;
            border-radius: 5px;
            background-color: white;
            height: 12px;
        }
    </style>
</head>

<body>
    <main>
        <section>
            <h1>Create Your LUID Account</h1>

            <form>

                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"required>

                <label for="mobile">Phone Number</label>
                <input type="tel" id="mobile" name="mobile"required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password"required>

                <label for="password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password"required>

                <a class="account" href="login.html">Create Account</a>
                 <!-- <button typle="submit" class="account" >Create Account</button> -->

                <p class="question">Already have an account?
                    <a class="login" href="login.html">Login</a>
                </p>





















            </form>
        </section>
    </main>

</body>

</html>
