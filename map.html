<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Map View - LandID</title>

    <link rel="stylesheet" href="map.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <h1>LUIN</h1>
            
        </div>

        

        <div class="profile">
            <span>👤</span>
            <p>My Profile</p>
        </div>

    </header>


    <!-- Layout -->
    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <a href="dashboard.html">
                🏠 Dashboard
            </a>

            <a href="add-land.html">
                ➕ Add New Land
            </a>

            <a href="my-land.html">
                🌱 My Lands
            </a>

            <a href="search-land.html">
                🔍 Search Land ID
            </a>

            <a href="map.html" class="active">
                🗺️ Map View
            </a>

            <a href="index.html" class="logout">
                🚪 Logout
            </a>

        </aside>


        <!-- Main Content -->
        <main class="main">

            <h1>Land Map</h1>

            


            <!-- Map -->
            <div class="map-container">

                <div class="map-placeholder">

                    <div class="location-marker">
                        📍
                    </div>

                    <h2>Registered Land</h2>

                    <p>
                        Pune, Maharashtra
                    </p>

                    <p class="land-id">
                        LUN-MH-PUN-0001
                    </p>

                </div>

            </div>


            <!-- Land Information -->
            <div class="land-info">

                <h2>Land Information</h2>

                <div class="info-row">
                    <span>Land ID</span>
                    <strong>LUN-MH-PUN-0001</strong>
                </div>

                <div class="info-row">
                    <span>Location</span>
                    <strong>Pune, Maharashtra</strong>
                </div>

                <div class="info-row">
                    <span>Area</span>
                    <strong>1300 sq.ft</strong>
                </div>

            </div>

        </main>

    </div>

</body>

</html>
